# Stack prod: tự đủ, không phụ thuộc container/network có sẵn nào trên máy chủ — server thật không
# có agent-postgres/redis-stack như máy dev. Postgres, Redis, MinIO (S3-compatible) đều là container
# riêng của chính stack này, dữ liệu bền qua volume.
#
# MinIO phục vụ integrations.storage (lưu file hợp đồng lao động của modules.payroll) qua S3 API.
#
# Chạy: docker compose -f docker-compose.prod.yml --env-file backend/.env.docker.prod up -d --build
name: eduerp-prod

networks:
  eduerp-net:

volumes:
  eduerp-pgdata:
  eduerp-minio-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduerp-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eduerp}
      POSTGRES_USER: ${DB_USERNAME:?bắt buộc đặt DB_USERNAME trong backend/.env.docker.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?bắt buộc đặt DB_PASSWORD trong backend/.env.docker.prod}
    volumes:
      - eduerp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eduerp-net

  redis:
    image: redis:7-alpine
    container_name: eduerp-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?bắt buộc đặt REDIS_PASSWORD trong backend/.env.docker.prod}", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eduerp-net

  minio:
    image: minio/minio:latest
    container_name: eduerp-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?bắt buộc đặt MINIO_ROOT_USER trong backend/.env.docker.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?bắt buộc đặt MINIO_ROOT_PASSWORD trong backend/.env.docker.prod}
    volumes:
      - eduerp-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eduerp-net

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eduerp-backend:prod
    container_name: eduerp-app-prod
    restart: unless-stopped
    env_file:
      - backend/.env.docker.prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IDENTITY_SECURE_COOKIES: "true"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: eduerp-contracts
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - eduerp-net

  eduerp-mcp:
    build:
      context: ./eduerp-mcp
      dockerfile: Dockerfile
    image: eduerp-mcp:prod
    container_name: eduerp-mcp-prod
    restart: unless-stopped
    env_file:
      - backend/.env.docker.prod
      - eduerp-mcp/.env.docker.prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EDUERP_API_BASE_URL: http://app:8080
      PUBLIC_URL: ${MCP_PUBLIC_URL:-https://dsacademy.edu.vn}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - eduerp-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: eduerp-frontend:prod
    container_name: eduerp-frontend-prod
    restart: unless-stopped
    env_file:
      - frontend/.env.prod
    networks:
      - eduerp-net
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  nginx:
    image: nginx:1.27-alpine
    container_name: eduerp-nginx-prod
    restart: unless-stopped
    user: "101:101"
    environment:
      EDGE_SERVER_NAME: "${EDGE_SERVER_NAME:-_}"
      EDGE_PROXY_HOST: "${EDGE_PROXY_HOST:-$$http_host}"
      EDGE_FORWARDED_PROTO: "${EDGE_FORWARDED_PROTO:-$$scheme}"
      EDGE_REAL_IP_FROM: "${EDGE_REAL_IP_FROM:-127.0.0.1}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        envsubst '$${EDGE_SERVER_NAME} $${EDGE_PROXY_HOST} $${EDGE_FORWARDED_PROTO} $${EDGE_REAL_IP_FROM}'
        < /etc/nginx/eduerp/nginx.conf.template > /tmp/nginx.conf
        && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-80}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/eduerp/nginx.conf.template:ro
    depends_on:
      app:
        condition: service_started
      eduerp-mcp:
        condition: service_started
      frontend:
        condition: service_healthy
    networks:
      - eduerp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header=\"Host: $${EDGE_SERVER_NAME%% *}\" http://127.0.0.1:8080/livez"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=32m,mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
