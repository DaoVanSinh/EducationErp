[project]
name = "eduerp-mcp"
version = "0.1.0"
description = "EduERP MCP Server — OAuth 2.1 + PKCE and Bearer Token MCP Gateway with Live ERP RBAC Enforcement"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.0",
    "fastmcp>=3.2.0,<3.3.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 14
