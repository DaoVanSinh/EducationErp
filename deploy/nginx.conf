worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 30s;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # The HTTPS edge / tunnel in front of this proxy.
    set_real_ip_from ${EDGE_REAL_IP_FROM};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Giữ nguyên X-Forwarded-Proto nếu đi qua Cloudflare / Reverse Proxy HTTPS phía trước tên miền.
    map $http_x_forwarded_proto $edge_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      ${EDGE_FORWARDED_PROTO};
    }

    # Exclude query strings: OAuth codes and credentials must not enter access logs.
    log_format ds_edge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';
    access_log /dev/stdout ds_edge;

    limit_req_zone $binary_remote_addr zone=ds_login:10m rate=10r/s;
    limit_req_status 429;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream eduerp_backend {
        zone eduerp_backend 64k;
        server app:8080 resolve;
        keepalive 32;
    }

    upstream eduerp_mcp {
        zone eduerp_mcp 64k;
        server eduerp-mcp:8700 resolve;
        keepalive 32;
    }

    upstream eduerp_frontend {
        zone eduerp_frontend 64k;
        server frontend:8080 resolve;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name ${EDGE_SERVER_NAME};

        proxy_http_version 1.1;
        proxy_set_header Host ${EDGE_PROXY_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
        proxy_set_header X-Forwarded-Host ${EDGE_PROXY_HOST};
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Never replay a request that could mutate state.
        proxy_next_upstream off;

        # ── 1. MCP Gateway & OAuth 2.1 Surfaces (eduerp-mcp:8700) ────────────────

        location ~ ^/(oauth/authorize|oauth/token|oauth/revoke)(/|$) {
            limit_req zone=ds_login burst=20 nodelay;
            proxy_pass http://eduerp_mcp;
        }

        location /mcp/ {
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://eduerp_mcp;
        }

        location = /mcp {
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://eduerp_mcp;
        }

        location /api/mcp/ {
            proxy_pass http://eduerp_mcp;
        }

        location /oauth/ {
            proxy_pass http://eduerp_mcp;
        }

        location /.well-known/ {
            proxy_pass http://eduerp_mcp;
        }

        location = /livez {
            proxy_pass http://eduerp_mcp;
        }

        location = /healthz {
            proxy_pass http://eduerp_mcp;
        }

        # ── 2. Spring Boot Backend API & OpenAPI (app:8080) ──────────────────────

        location = /api/auth/login {
            limit_req zone=ds_login burst=20 nodelay;
            proxy_pass http://eduerp_backend;
        }

        # Multipart uploads (avatars, labor contracts): 20 MiB limit.
        location /api/ {
            client_max_body_size 20m;
            proxy_pass http://eduerp_backend;
        }

        location /v3/api-docs {
            proxy_pass http://eduerp_backend;
        }

        location /swagger-ui/ {
            proxy_pass http://eduerp_backend;
        }

        # ── 3. Frontend Console & Static Assets (frontend:8080) ──────────────────

        location / {
            proxy_pass http://eduerp_frontend;
        }
    }
}
