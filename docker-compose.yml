# Stack stg (make compose-up, ENV mặc định) — chạy tại chỗ trên máy này, không phải server riêng:
# build app + nginx vào container, KHÔNG tự dựng Postgres/Redis — máy này đã có sẵn container dùng
# chung cho nhiều dự án (agent-postgres, redis-stack), backend nối ra đó qua host.docker.internal
# (đặt sẵn trong backend/.env.docker). Không join network ngoài nào (shared-infra/elearning-net
# không tồn tại ở máy này) — network dưới đây do chính stack này tạo, chỉ để app <-> nginx nói
# chuyện với nhau.
#
# Chạy: make compose-up   (hoặc: docker compose --env-file backend/.env.docker up -d --build)
# Mở:  http://localhost:8090
name: eduerp-stg

networks:
  eduerp-net:

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eduerp-backend:stg
    container_name: eduerp-app
    restart: unless-stopped
    env_file:
      - backend/.env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - eduerp-net

  eduerp-mcp:
    build:
      context: ./eduerp-mcp
      dockerfile: Dockerfile
    image: eduerp-mcp:stg
    container_name: eduerp-mcp
    restart: unless-stopped
    env_file:
      - backend/.env.docker
      - eduerp-mcp/.env.docker
    environment:
      EDUERP_API_BASE_URL: http://app:8080
      PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    networks:
      - eduerp-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: eduerp-frontend:stg
    container_name: eduerp-frontend
    restart: unless-stopped
    env_file:
      - frontend/.env.docker
    networks:
      - eduerp-net
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  nginx:
    image: nginx:1.27-alpine
    container_name: eduerp-nginx
    restart: unless-stopped
    user: "101:101"
    environment:
      EDGE_SERVER_NAME: "${EDGE_SERVER_NAME:-_}"
      EDGE_PROXY_HOST: "${EDGE_PROXY_HOST:-$$http_host}"
      EDGE_FORWARDED_PROTO: "${EDGE_FORWARDED_PROTO:-$$scheme}"
      EDGE_REAL_IP_FROM: "${EDGE_REAL_IP_FROM:-127.0.0.1}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        envsubst '$${EDGE_SERVER_NAME} $${EDGE_PROXY_HOST} $${EDGE_FORWARDED_PROTO} $${EDGE_REAL_IP_FROM}'
        < /etc/nginx/eduerp/nginx.conf.template > /tmp/nginx.conf
        && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8090}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/eduerp/nginx.conf.template:ro
    depends_on:
      app:
        condition: service_started
      eduerp-mcp:
        condition: service_started
      frontend:
        condition: service_healthy
    networks:
      - eduerp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header=\"Host: $${EDGE_SERVER_NAME%% *}\" http://127.0.0.1:8080/livez"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=32m,mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
