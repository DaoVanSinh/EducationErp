services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eduerp
      POSTGRES_USER: eduerp
      POSTGRES_PASSWORD: eduerp
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]
