# Một origin duy nhất cho cả SPA và API — đúng lý do CookieAuthenticationFilter/CSRF của backend
# dùng cookie SameSite=Strict (xem vite.config.ts): browser không bao giờ thấy đây là cross-origin,
# kể cả khi build production, không chỉ lúc dev qua Vite proxy.
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # API + tài liệu API: chuyển thẳng sang backend, giữ nguyên path (không rewrite).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookie phiên/CSRF phải qua nguyên vẹn — không set/rewrite Set-Cookie ở đây.
    }

    location /v3/api-docs {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    # Asset đã hash tên theo nội dung (Vite) — cache dài hạn, đổi nội dung thì tên file đổi theo.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA dùng client-side routing: mọi path không khớp file tĩnh nào đều trả về index.html, để
    # React Router tự quyết định hiển thị gì — thiếu dòng này thì F5 ở /dashboard sẽ ra 404 của nginx.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
